services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rhou
      POSTGRES_PASSWORD: K3MScG!d
      POSTGRES_DB: arc_dataset
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_dataset"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rhou
      MINIO_ROOT_PASSWORD: jwdsvl!FL
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 rhou jwdsvl!FL; do sleep 1; done;
      mc mb --ignore-existing local/arc-human-games;
      exit 0;
      "

  api:
    build: .
    environment:
      API_PREFIX: ${API_PREFIX:-/v1}
      DATABASE_URL: postgresql+psycopg://rhou:K3MScG!d@postgres:5432/arc_dataset
      S3_BUCKET: arc-human-games
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ""
      S3_ACCESS_KEY_ID: rhou
      S3_SECRET_ACCESS_KEY: jwdsvl!FL
      S3_FORCE_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "false"
      ALLOWED_ORIGINS: https://hse.onl
      READ_API_KEY: ${READ_API_KEY:-}
    ports:
       - "127.0.0.1:8000:8000"
    volumes:
      - ${DATASET_PATH:-./public-games-dataset}:/data/public-games-dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
volumes:
  postgres-data:
  minio-data:
