services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
      POSTGRES_DB: arc_dataset
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_dataset"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: arcminio
      MINIO_ROOT_PASSWORD: arcminio-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 arcminio arcminio-secret; do sleep 1; done;
      mc mb --ignore-existing local/arc-human-games;
      exit 0;
      "

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://arc:arc@postgres:5432/arc_dataset
      S3_BUCKET: arc-human-games
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: arcminio
      S3_SECRET_ACCESS_KEY: arcminio-secret
      S3_FORCE_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "false"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      READ_API_KEY: ${READ_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ${DATASET_PATH:-./public-games-dataset}:/data/public-games-dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
