name: Project train real-model smoke

on:
  pull_request:
    paths:
      - project_train.py
      - scripts/smoke_project_train_real.py
      - .github/workflows/project-train-real-smoke.yml
  workflow_dispatch:

jobs:
  real-model-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,train]'

      - name: Run project plugin tests
        run: python -m pytest tests/test_project_plugins.py -q

      - name: Cache the real model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen2.5-1.5b-instruct-${{ runner.os }}

      - name: Run one real-model LoRA update
        run: |
          python scripts/smoke_project_train_real.py \
            --output artifacts/project-train-real-smoke \
            --pack-len 64
