name: DRLQN CI

on:
  pull_request:
  push:
    branches:
      - codex/hybrid-spatial-distillation

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test_target:
          - tests/test_autodiff.py
          - tests/test_env.py
          - tests/test_jvp.py
          - tests/test_scale.py
          - tests/test_distill.py
          - tests/test_spatial.py::test_infers_rendered_tile_scale
          - tests/test_spatial.py::test_proposals_cover_individual_cells_inside_merged_region
          - tests/test_spatial.py::test_changed_region_gets_high_priority_anchor
          - tests/test_spatial.py::test_hybrid_solver_smoke_on_local_environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy requests pytest
      - name: Run ${{ matrix.test_target }}
        env:
          PYTHONPATH: .
        run: pytest -vv ${{ matrix.test_target }}
