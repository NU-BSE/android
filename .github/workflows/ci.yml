name: DRLQN CI

on:
  pull_request:
  push:
    branches:
      - codex/hybrid-spatial-distillation

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_autodiff.py
          - tests/test_env.py
          - tests/test_jvp.py
          - tests/test_scale.py
          - tests/test_spatial.py
          - tests/test_distill.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy requests pytest
      - name: Run ${{ matrix.test_file }}
        env:
          PYTHONPATH: .
        run: pytest -vv ${{ matrix.test_file }}
