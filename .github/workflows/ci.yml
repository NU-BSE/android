name: DRLQN CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test_target:
          - tests/test_autodiff.py
          - tests/test_env.py
          - tests/test_jvp.py
          - tests/test_scale.py
          - tests/test_distill.py
          - tests/test_duck_sft.py
          - tests/test_duck_dense_replay.py
          - tests/test_replay_duck_trajectories.py
          - tests/test_arc_dataset_client.py
          - tests/test_drlqn_ablation_solver.py
          - tests/test_planner_portfolio.py
          - tests/test_offline_experience.py
          - tests/test_curriculum.py
          - tests/test_submission_run.py
          - tests/test_spatial.py::test_infers_rendered_tile_scale
          - tests/test_spatial.py::test_proposals_cover_individual_cells_inside_merged_region
          - tests/test_spatial.py::test_changed_region_gets_high_priority_anchor
          - tests/test_spatial.py::test_hybrid_solver_smoke_on_local_environment
          - tests/test_top_route.py::test_extra_action_reuses_reserved_logits_without_becoming_click
          - tests/test_top_route.py::test_short_history_distinguishes_same_rendered_frame
          - tests/test_top_route.py::test_bounded_history_revisits_state_after_window_saturates
          - tests/test_top_route.py::test_known_winning_edge_preempts_new_exploration
          - tests/test_top_route.py::test_arcade_adapter_uses_dynamic_available_actions_and_action7
          - tests/test_top_route.py::test_official_environment_tree_fits_fixed_action_mapping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy requests pytest
      - name: Run ${{ matrix.test_target }}
        env:
          PYTHONPATH: .
        run: pytest -vv ${{ matrix.test_target }}

  syntax-and-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new training and submission entry points
        run: >-
          python -m py_compile
          drlqn/data/arc_dataset.py
          drlqn/planning/portfolio.py
          drlqn/train/offline_experience.py
          drlqn/train/curriculum.py
          drlqn/accelerator/models.py
          scripts/replay_duck_trajectories.py
          scripts/generate_offline_experience.py
          scripts/train_curriculum.py
          scripts/train_accelerated_students.py
          scripts/benchmark_accelerated_students.py
          scripts/benchmark_drlqn_matrix.py
          scripts/merge_matrix_rows.py
          scripts/run_submission_scorecard.py
          scripts/package_submission.py
          scripts/validate_submission_bundle.py

  official-environment-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official engine dependency
        run: python -m pip install --upgrade pip numpy pytest arcengine==0.9.3
      - name: Execute all 25 environments through the submission adapter
        env:
          PYTHONPATH: .
        run: pytest -vv tests/test_official_env_runtime.py
      - name: Run four-action-per-level official smoke benchmark
        env:
          PYTHONPATH: .
        run: >-
          python scripts/benchmark_official.py
          --max-actions-per-level 4
          --max-levels 8
          --output results/official_smoke.json
      - name: Upload official smoke results
        uses: actions/upload-artifact@v4
        with:
          name: official-smoke-results
          path: results/official_smoke.json
