name: DRLQN CI

on:
  pull_request:
  push:
    branches:
      - codex/hybrid-spatial-distillation

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy requests pytest
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests
