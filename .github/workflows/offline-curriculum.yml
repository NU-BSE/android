name: DRLQN Offline Curriculum

on:
  workflow_dispatch:
    inputs:
      game_codes:
        description: "Optional comma-separated Duck game filters; empty replays all recordings"
        required: false
        default: ""
      seeds:
        description: "Comma-separated environment rollout seeds"
        required: true
        default: "0,1,2,3,4"
      max_actions_per_level:
        description: "Offline generation action budget per level"
        required: true
        default: "300"
      run_full_matrix:
        description: "Run the complete 32/100/300/600 x five-seed ablation matrix"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      ARC_DATASET_API_KEY: ${{ secrets.ARC_DATASET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip numpy pytest arcengine==0.9.3
      - name: Require dataset secret
        run: |
          if [ -z "$ARC_DATASET_API_KEY" ]; then
            echo "Set the ARC_DATASET_API_KEY repository secret before dispatching this workflow."
            exit 1
          fi
      - name: Reconstruct dense Duck trajectories
        shell: bash
        run: |
          args=()
          IFS=',' read -ra games <<< "${{ inputs.game_codes }}"
          for game in "${games[@]}"; do
            game="${game// /}"
            if [ -n "$game" ]; then args+=(--game "$game"); fi
          done
          python scripts/replay_duck_trajectories.py \
            --base-url https://hse.onl/agi-3 \
            "${args[@]}" \
            --output data/duck_dense_transitions.npz \
            --report results/duck_replay_report.json
      - name: Generate random, frontier, and portfolio experience on all 25 games
        shell: bash
        run: |
          args=()
          IFS=',' read -ra seeds <<< "${{ inputs.seeds }}"
          for seed in "${seeds[@]}"; do
            seed="${seed// /}"
            if [ -n "$seed" ]; then args+=(--seed "$seed"); fi
          done
          python scripts/generate_offline_experience.py \
            "${args[@]}" \
            --policy random \
            --policy frontier \
            --policy specialist \
            --max-actions-per-level "${{ inputs.max_actions_per_level }}" \
            --output data/environment_generated_transitions.npz \
            --manifest results/environment_generated_manifest.json
      - name: Train staged Duck/environment/planner checkpoint
        run: |
          python scripts/train_curriculum.py \
            --duck data/duck_dense_transitions.npz \
            --generated data/environment_generated_transitions.npz \
            --output-checkpoint checkpoints/duck_env_planner_drlqn_xs.npz \
            --metrics results/curriculum_metrics.json
      - name: Run focused portfolio baseline
        if: inputs.run_full_matrix == 'false'
        run: |
          python scripts/benchmark_drlqn_matrix.py \
            --duck-checkpoint checkpoints/duck_env_planner_drlqn_xs.npz \
            --budget 100 \
            --seed 0 --seed 1 \
            --history on \
            --graph on \
            --portfolio off --portfolio on \
            --differential off --differential on \
            --rows results/drlqn_focused_matrix.jsonl \
            --output results/drlqn_focused_matrix.json
      - name: Run complete official matrix
        if: inputs.run_full_matrix == 'true'
        run: |
          python scripts/benchmark_drlqn_matrix.py \
            --duck-checkpoint checkpoints/duck_env_planner_drlqn_xs.npz \
            --rows results/drlqn_baseline_matrix.jsonl \
            --output results/drlqn_baseline_matrix.json \
            --resume
      - name: Upload reconstructed data, checkpoints, and telemetry
        uses: actions/upload-artifact@v4
        with:
          name: drlqn-offline-curriculum
          retention-days: 14
          path: |
            data/*.npz
            checkpoints/*.npz
            checkpoints/*.json
            results/*.json
            results/*.jsonl
