name: Dual LoRA data pipelines

on:
  pull_request:
    paths:
      - android_drlqn/mobileforge_data.py
      - android_drlqn/qwen_screen_qa.py
      - scripts/prepare_mobileforge_gui_policy.py
      - scripts/generate_qwen_screen_chat.py
      - scripts/train_gui_owl_adapter.py
      - tests/test_mobileforge_data.py
      - tests/test_qwen_screen_qa.py
      - tests/test_gui_owl_adapter_data.py
      - config/gui_owl_dual_lora_data.json
      - pyproject.toml
      - .github/workflows/data-pipelines.yml
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile data pipeline modules
        run: |
          python -m py_compile \
            android_drlqn/mobileforge_data.py \
            android_drlqn/qwen_screen_qa.py \
            scripts/prepare_mobileforge_gui_policy.py \
            scripts/generate_qwen_screen_chat.py \
            scripts/train_gui_owl_adapter.py
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_mobileforge_data.py \
            tests/test_qwen_screen_qa.py \
            tests/test_gui_owl_adapter_data.py
