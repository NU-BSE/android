name: Dual LoRA data pipelines

on:
  pull_request:
    paths:
      - android_drlqn/unigui_openmobile.py
      - android_drlqn/ui_mopd.py
      - android_drlqn/qwen_screen_qa.py
      - android_drlqn/gui_owl_student.py
      - scripts/prepare_unigui_gui_policy.py
      - scripts/generate_qwen_screen_chat.py
      - scripts/train_gui_owl_adapter.py
      - scripts/calibrate_gui_owl_compression.py
      - scripts/normalize_gui_owl_calibration.py
      - scripts/build_gui_owl_student.py
      - scripts/distill_gui_owl_student.py
      - scripts/run_gui_owl_progressive_distillation.py
      - scripts/export_gui_owl_gguf.sh
      - scripts/package_gui_owl_students.sh
      - scripts/pull_gui_owl_students_to_mac.sh
      - tests/test_unigui_openmobile.py
      - tests/test_ui_mopd.py
      - tests/test_qwen_screen_qa.py
      - tests/test_gui_owl_adapter_data.py
      - tests/test_gui_owl_student.py
      - tests/test_gui_owl_progressive_pipeline.py
      - tests/test_gguf_export_scripts.py
      - config/gui_owl_dual_lora_data.json
      - config/gui_owl_students.json
      - pyproject.toml
      - Dockerfile.train
      - compose.yaml
      - .dockerignore
      - .env.example
      - docs/docker_ubuntu_training.md
      - docs/unigui_qwen_ui_mopd.md
      - docs/gui_owl_student_distillation.md
      - docs/gui_owl_gguf_mac_transfer.md
      - .github/workflows/data-pipelines.yml
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile data pipeline modules
        run: |
          python -m py_compile \
            android_drlqn/unigui_openmobile.py \
            android_drlqn/ui_mopd.py \
            android_drlqn/qwen_screen_qa.py \
            android_drlqn/gui_owl_student.py \
            scripts/prepare_unigui_gui_policy.py \
            scripts/generate_qwen_screen_chat.py \
            scripts/train_gui_owl_adapter.py \
            scripts/calibrate_gui_owl_compression.py \
            scripts/normalize_gui_owl_calibration.py \
            scripts/build_gui_owl_student.py \
            scripts/distill_gui_owl_student.py \
            scripts/run_gui_owl_progressive_distillation.py
      - name: Validate shell scripts
        run: |
          bash -n scripts/export_gui_owl_gguf.sh
          bash -n scripts/package_gui_owl_students.sh
          bash -n scripts/pull_gui_owl_students_to_mac.sh
      - name: Validate Docker Compose
        run: docker compose config -q
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_unigui_openmobile.py \
            tests/test_ui_mopd.py \
            tests/test_qwen_screen_qa.py \
            tests/test_gui_owl_adapter_data.py \
            tests/test_gui_owl_student.py \
            tests/test_gui_owl_progressive_pipeline.py \
            tests/test_gguf_export_scripts.py
