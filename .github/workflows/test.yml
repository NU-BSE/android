name: Android advisor tests

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m py_compile android_drlqn/*.py examples/*.py scripts/*.py
