[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-drlqn"
version = "0.5.0"
description = "Evidence-backed Android DRLQN with local VLM, chat coordination and on-policy distillation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
ollama = ["pillow>=10.0"]
train = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "safetensors>=0.4",
  "pillow>=10.0"
]

[tool.setuptools.packages.find]
include = ["android_drlqn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
