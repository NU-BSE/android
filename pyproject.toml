[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-drlqn"
version = "0.1.0"
description = "Android-only DRLQN agent for timestamped window trajectories"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["android_drlqn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
