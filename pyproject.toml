[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-drlqn"
version = "0.2.0"
description = "Policy-safe Android DRLQN planner with on-device chat guidance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["android_drlqn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
